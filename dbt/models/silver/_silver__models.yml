version: 2

models:
  - name: comunas
    description: Las 15 comunas de la Ciudad con su polígono (ADR 001).
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal:
          arguments:
            value: 15
    columns:
      - name: comuna
        description: Número de comuna, de 1 a 15.
        data_tests:
          - unique
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 15
      - name: barrios
        description: Barrios de la comuna, solo descriptivo (no hay polígonos por barrio).
      - name: perimeter_m
        description: Perímetro en metros.
      - name: area_m2
        description: Superficie en metros cuadrados.
      - name: geom
        description: Polígono de la comuna, MultiPolygon WGS84 (SRID 4326).
        data_tests:
          - not_null

  - name: stations
    description: >
      Estaciones del sistema actual más las que solo aparecen en los viajes (ADR 002), con su
      comuna asignada por punto en polígono (ADR 001).
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal:
          arguments:
            value: 413
    columns:
      - name: station_id
        description: ID de la estación (sin el sufijo BAEcobici de los viajes).
        data_tests:
          - unique
          - not_null
      - name: station_number
        description: Número público de la estación. No es clave; NULL si viene de los viajes.
      - name: station_name
        description: Nombre de la estación según el catálogo (o el más frecuente en los viajes).
        data_tests:
          - not_null
      - name: address
        description: Dirección de la estación.
      - name: latitude
        description: Latitud WGS84, dentro de CABA. NULL si la estación no tiene ubicación.
        data_tests:
          - not_null:
              config:
                where: "comuna_assignment <> 'unknown'"
      - name: longitude
        description: Longitud WGS84, dentro de CABA. NULL si la estación no tiene ubicación.
        data_tests:
          - not_null:
              config:
                where: "comuna_assignment <> 'unknown'"
      - name: geom
        description: Punto PostGIS de la estación (SRID 4326). NULL si la estación no tiene ubicación.
        data_tests:
          - not_null:
              config:
                where: "comuna_assignment <> 'unknown'"
      - name: comuna
        description: Comuna donde está la estación; NULL si no tiene ubicación (unknown).
        data_tests:
          - not_null:
              config:
                where: "comuna_assignment <> 'unknown'"
          - relationships:
              arguments:
                to: ref('comunas')
                field: comuna
      - name: comuna_assignment
        description: >
          contains si la estación cae dentro del polígono; nearest si se asignó la comuna más
          cercana (solo AEROPARQUE); unknown si no tiene coordenadas válidas (solo la 510
          "[Valet] Galpón").
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [contains, nearest, unknown]
      - name: source
        description: catalog (estaciones.csv) o trips (completada desde los viajes).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [catalog, trips]

  - name: users
    description: >
      Usuarios con alta en 2024 y 2025 unificados en un esquema común (FR-01c, ADR 003).
      Cubren el 49 % de los viajes; el resto son altas anteriores a 2024.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "extract(year from signed_up_at) = signup_year"
      - dbt_utils.expression_is_true:
          arguments:
            # El archivo 2024 no trae DNI; el 2025 siempre lo trae.
            expression: "(signup_year = 2024) = (has_dni is null)"
    columns:
      - name: user_id
        description: ID del usuario (el de los viajes, sin el sufijo BAEcobici).
        data_tests:
          - unique
          - not_null
      - name: gender
        description: MALE, FEMALE u OTHER según el archivo de usuarios.
        data_tests:
          - accepted_values:
              arguments:
                values: [MALE, FEMALE, OTHER]
      - name: age
        description: >
          Edad declarada al alta. NULL si estaba fuera de [15, 100] o no era un entero
          (incluye años cargados como edad, por ejemplo "2,024").
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 15
                max_value: 100
              config:
                where: "age is not null"
      - name: signed_up_at
        description: Fecha y hora de alta (hora local de Buenos Aires).
        data_tests:
          - not_null
      - name: signup_date
        description: Fecha de alta.
        data_tests:
          - not_null
      - name: signup_year
        description: Año del archivo de origen (2024 o 2025).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2024, 2025]
                quote: false
      - name: has_dni
        description: Si el usuario registró DNI. NULL para las altas 2024 (el archivo no lo trae).
      - name: source_file
        description: Archivo de origen.

  - name: users_rejected
    description: >
      Filas de los archivos de usuarios descartadas (FR-08), con el motivo y la fila de origen
      en bronze.
    columns:
      - name: reject_reason
        description: invalid_user_id, invalid_signup_date o duplicate_user_id.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [invalid_user_id, invalid_signup_date, duplicate_user_id]
      - name: source_file
        description: Archivo de origen.
      - name: source_row_number
        description: Fila en el archivo de origen (bronze._row_number).

  - name: trips
    description: >
      Viajes de 2025 que pasan todas las reglas de calidad de FR-07. Los atributos de las
      estaciones se toman de stations; los del usuario, de users (cuando tiene perfil).
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "extract(year from started_at) = {{ var('analysis_year') }}"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "ended_at >= started_at"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_round_trip = (origin_station_id = destination_station_id)"
      # La duración informada coincide con fin - inicio salvo en 8 viajes, cuyo fin quedó igual al
      # inicio. Se conservan (la duración es la medida del sistema) y se avisan sin frenar.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(duration_seconds - extract(epoch from ended_at - started_at)) <= 60"
          config:
            severity: warn
    columns:
      - name: trip_id
        description: ID del viaje (sin el sufijo BAEcobici).
        data_tests:
          - unique
          - not_null
      - name: started_at
        description: Inicio del viaje (hora local de Buenos Aires).
        data_tests:
          - not_null
      - name: ended_at
        description: Fin del viaje; puede caer en 2026 si el viaje cruzó el fin de año.
        data_tests:
          - not_null
      - name: duration_seconds
        description: Duración informada por el sistema, en segundos (1 a 86.400).
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 86400
      - name: origin_station_id
        description: Estación de origen.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stations')
                field: station_id
      - name: destination_station_id
        description: Estación de destino.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stations')
                field: station_id
      - name: user_id
        description: >
          Usuario que hizo el viaje. El 51 % no está en users (altas anteriores a 2024,
          ADR 003), así que no hay test de relación acá; dim_user sí incluye a todos.
        data_tests:
          - not_null
      - name: bike_model
        description: Modelo de bicicleta.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [FIT, ICONIC]
      - name: gender
        description: Género informado en el viaje (MALE, FEMALE, OTHER); NULL si vino vacío.
        data_tests:
          - accepted_values:
              arguments:
                values: [MALE, FEMALE, OTHER]
      - name: is_round_trip
        description: El viaje termina en la misma estación donde empezó.
        data_tests:
          - not_null

  - name: trips_rejected
    description: >
      Filas del archivo de viajes descartadas (FR-08), con el motivo y la fila de origen en
      bronze.
    columns:
      - name: reject_reason
        description: Primera regla de FR-07 que no se cumple.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - invalid_trip_id
                  - duplicate_trip_id
                  - invalid_timestamp
                  - out_of_period
                  - destination_before_origin
                  - missing_station
                  - unknown_station
                  - invalid_duration
                  - non_positive_duration
                  - duration_over_24h
                  - invalid_user_id
                  - invalid_bike_model
      - name: source_file
        description: Archivo de origen.
      - name: source_row_number
        description: Fila en el archivo de origen (bronze._row_number).
