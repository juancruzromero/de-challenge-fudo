# Conexión de dbt. Todo sale de variables de entorno (.env); no hay credenciales en el repo.
# En el contenedor POSTGRES_HOST=postgres; corriendo desde la máquina local, POSTGRES_HOST=localhost.
ecobici:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      user: "{{ env_var('ETL_DB_USER') }}"
      password: "{{ env_var('ETL_DB_PASSWORD') }}"
      schema: silver
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      connect_timeout: 10
