name: ecobici
version: "0.1.0"
config-version: 2
profile: ecobici

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
clean-targets: ["target", "dbt_packages"]

# Arquitectura medallion (plan.md §4). bronze lo carga el ETL en Python; dbt arma silver y gold.
# Las vistas de staging (stg_*) van en silver para no necesitar un schema más.
models:
  ecobici:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: silver
      +materialized: view
    # vacuum analyze después de crear cada tabla (T6.2, sql/optimization/README.md). dbt no lo
    # hace y hasta que pasa el autovacuum (que nunca toca las tablas chicas) la tabla queda:
    # - sin estadísticas: el planner estima a ciegas;
    # - sin visibility map: no hay index-only scans y cada lectura termina de setear hint bits.
    # VACUUM no puede correr dentro de una transacción: va con transaction: false.
    # parallel 0: el vacuum paralelo de índices pide memoria compartida (/dev/shm, 64 MB en
    # Docker) y fallaba en fct_trips; en una tabla recién creada no hay nada que limpiar.
    silver:
      +schema: silver
      +materialized: table
      +post-hook:
        - sql: "vacuum (analyze, parallel 0) {{ this }}"
          transaction: false
    gold:
      +schema: gold
      +materialized: table
      +post-hook:
        - sql: "vacuum (analyze, parallel 0) {{ this }}"
          transaction: false

seeds:
  ecobici:
    +schema: silver

tests:
  ecobici:
    +severity: error

vars:
  # Período analizado: los viajes fuera de este año se rechazan (FR-07).
  analysis_year: 2025
  # Q6: cantidad de usuarios en el ranking de más activos.
  top_users: 100
  # Caja que contiene a CABA, con margen. Una coordenada fuera se trata como faltante
  # (por ejemplo, los 176 destinos con lat/long en 0).
  caba_bbox:
    lat_min: -34.75
    lat_max: -34.50
    lon_min: -58.55
    lon_max: -58.30
