[project]
name = "ecobici-etl"
version = "0.1.0"
description = "Pipeline de Ecobici BA: ingesta a bronze (Python) y transformaciones (dbt)"
requires-python = ">=3.12"
dependencies = [
    # dbt cambia comportamiento entre versiones menores: se acota a la menor probada.
    "dbt-core>=1.12,<1.13",
    "dbt-postgres>=1.11,<1.12",
    "psycopg[binary]>=3.3",
]

[dependency-groups]
# ruff y sqlfluff fijados a la misma versión que .pre-commit-config.yaml
dev = [
    "pre-commit>=4.7",
    "pytest>=9.1",
    "ruff==0.17.1",
    "sqlfluff==4.4.0",
]

[project.scripts]
ecobici-ingest = "ingest.cli:main"
ecobici-profile = "profiling.profile:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest", "src/profiling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests que necesitan una base Postgres levantada",
]
