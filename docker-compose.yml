# Stack local del challenge. Se levanta con `make up` (o `docker compose up -d`).
# Las variables salen de .env (copiar .env.example). El servicio metabase-provision se agrega
# en T7.1, cuando exista su imagen.

name: ecobici

services:
  # Base analítica: bronze, silver y gold. PostGIS para asignar comunas (ADR 001).
  # imresamu/postgis es la variante multi-arquitectura (amd64 y arm64) de postgis/postgis.
  postgres:
    image: imresamu/postgis:16-3.5.3-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?definir en .env}
      POSTGRES_USER: ${POSTGRES_USER:?definir en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      ETL_DB_USER: ${ETL_DB_USER:?definir en .env}
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD:?definir en .env}
      BI_DB_USER: ${BI_DB_USER:?definir en .env}
      BI_DB_PASSWORD: ${BI_DB_PASSWORD:?definir en .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts de init (T2.2): solo corren la primera vez, con el volumen vacío.
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Pipeline one-shot: ingesta a bronze + dbt build. Termina y queda en estado "exited (0)".
  # Volver a correrlo: make etl. Es idempotente: solo recarga los archivos que cambiaron.
  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    image: ecobici-etl:local
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      ETL_DB_USER: ${ETL_DB_USER}
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD}
      DATA_RAW_DIR: /data/raw
      DATA_REFERENCE_DIR: /data/reference
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - ./data/raw:/data/raw:ro
      - ./data/reference:/data/reference:ro

  # Base interna de Metabase (preguntas, dashboards, usuarios). Separada de la analítica.
  metabase-db:
    image: postgres:16.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MB_DB_DBNAME:?definir en .env}
      POSTGRES_USER: ${MB_DB_USER:?definir en .env}
      POSTGRES_PASSWORD: ${MB_DB_PASSWORD:?definir en .env}
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  metabase:
    image: metabase/metabase:v0.64.2.7
    restart: unless-stopped
    depends_on:
      metabase-db:
        condition: service_healthy
      # El dashboard arranca con datos: solo si el pipeline terminó bien.
      etl:
        condition: service_completed_successfully
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${MB_DB_DBNAME}
      MB_DB_USER: ${MB_DB_USER}
      MB_DB_PASS: ${MB_DB_PASSWORD}
      MB_SITE_LOCALE: es
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
    ports:
      - "${METABASE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  postgres-data:
  metabase-db-data:
